<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attica</title>
<style>
:root{
  --paper:#f1ece1; --card:#f8f3e8; --ink:#1d1a14; --soft:#6b6452; --rule:#d6cdb8;
  --accent:#cf4a1e; --accent-ink:#ffffff; --teal:#2c4a47; --mark:#f6d96b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#171410; --card:#221e18; --ink:#f1ece1; --soft:#a89f88; --rule:#3a3428;
    --accent:#e8643a; --accent-ink:#171410; --teal:#7fb0a9; --mark:#6b5a14;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:18px/1.5 Georgia,"Times New Roman",serif;min-height:100vh}
main{max-width:34rem;margin:0 auto;padding:20px 16px 56px}
h1{font:700 2rem/1.1 Georgia,serif;letter-spacing:-.01em;margin:.2em 0 .1em}
h2{font:700 1.25rem/1.25 Georgia,serif;margin:1.2em 0 .4em}
p{margin:.6em 0}
.mono{font:600 .75rem/1.2 ui-monospace,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px;margin:14px 0}
.scene{border-left:4px solid var(--accent)}
button{font:600 1rem/1.2 system-ui,sans-serif;border:2px solid var(--ink);background:var(--card);color:var(--ink);
  padding:14px 16px;border-radius:10px;cursor:pointer;min-height:48px}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{border-color:var(--rule);color:var(--soft);font-weight:500;min-height:40px;padding:8px 12px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>button{flex:1 1 9rem}
.choice b{display:block;font-size:1.1rem;margin-bottom:2px}
.choice span{font-weight:400;font-size:.9rem;color:var(--soft)}
table{width:100%;border-collapse:collapse;font:.88rem/1.35 system-ui,sans-serif;margin:.4em 0}
th,td{border-bottom:1px solid var(--rule);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--soft);font-weight:600}
td.n{text-align:center;white-space:nowrap}
.score{display:flex;gap:12px}
.score div{flex:1;text-align:center;padding:10px;border:1px solid var(--rule);border-radius:10px;background:var(--card)}
.score b{display:block;font:700 1.9rem/1 Georgia,serif}
.lock{font:600 1.05rem/1.4 system-ui,sans-serif}
.big{font:700 1.5rem/1.2 Georgia,serif}
mark{background:var(--mark);color:inherit;padding:0 .15em;border-radius:3px}
.steps{padding-left:1.2em}
.steps li{margin:.35em 0}
.small{font-size:.9rem;color:var(--soft)}
.foot{margin-top:28px;border-top:1px solid var(--rule);padding-top:10px}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion: no-preference){ .card{animation:in .18s ease-out} @keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>

<script>
(function(){
  var ROUNDS = 3;
  var PTS = { // mine, theirs -> [my points, their points]
    CC:[2,2], CX:[0,3], XC:[3,0], XX:[1,1]
  };
  var NAME = {C:"Cooperate", X:"Compete"};
  var STORE = "attica-state-v1";
  var app = document.getElementById("app");
  var S = null;

  function save(){ try{ sessionStorage.setItem(STORE, JSON.stringify(S)); }catch(e){} }
  function load(){ try{ return JSON.parse(sessionStorage.getItem(STORE)); }catch(e){ return null; } }
  function fresh(seat){ return {seat:seat||0, round:1, phase:seat?"intro":"picker", mine:[], theirs:[], pending:null}; }

  function word(){ return S.seat===1 ? "partner" : "competitor"; }
  function totals(){
    var m=0,t=0;
    for(var i=0;i<S.mine.length;i++){ var p=PTS[S.mine[i]+S.theirs[i]]; m+=p[0]; t+=p[1]; }
    return [m,t];
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  function matrix(){
    return '<table aria-label="Payoff matrix"><tr><th>You</th><th>Them</th><th class="n">You get</th><th class="n">They get</th></tr>'
      + '<tr><td>Cooperate</td><td>Cooperate</td><td class="n">2</td><td class="n">2</td></tr>'
      + '<tr><td>Cooperate</td><td>Compete</td><td class="n">0</td><td class="n">3</td></tr>'
      + '<tr><td>Compete</td><td>Cooperate</td><td class="n">3</td><td class="n">0</td></tr>'
      + '<tr><td>Compete</td><td>Compete</td><td class="n">1</td><td class="n">1</td></tr></table>';
  }
  function scoreBar(){
    var t=totals();
    return '<div class="score" role="group" aria-label="Running totals"><div><span class="mono">You</span><b>'+t[0]+'</b></div><div><span class="mono">Them</span><b>'+t[1]+'</b></div></div>';
  }
  function scene(){
    var w = word();
    var who = S.seat===1 ? "your potential partner" : "a competitor";
    return '<div class="card scene"><p class="mono">Seat '+S.seat+' &middot; private screen</p>'
      + '<p>Welcome to the tech industry. You lead an innovative company that has found a way to revolutionize battery technology. '
      + 'Word just reached you that '+who+' has been developing parallel technology. '
      + 'Launch timing matters, and you must decide your move before the industry conference in 48 hours.</p></div>';
  }

  var OUT = {
    XX:"A fierce battle erupts. Marketing budgets skyrocket as both companies chase the same share of the market.",
    CC:"A powerful alliance is born. Your combined expertise opens opportunities neither company had alone.",
    XC:"A bold power play succeeds. Your aggressive move catches the other company off guard and reshapes the market.",
    CX:"Your openness leaves you exposed. The other company moves first and takes the market."
  };

  function render(){
    var h="";
    if(S.phase==="picker"){
      h = '<p class="mono">Attica</p><h1>Which seat are you?</h1>'
        + '<p>Your instructor will tell you. Two people sitting together must pick different seats, and you should not compare screens until you are told to.</p>'
        + '<div class="row"><button class="primary" data-act="seat" data-v="1">Seat 1</button><button class="primary" data-act="seat" data-v="2">Seat 2</button></div>';
    } else if(S.phase==="intro"){
      h = '<p class="mono">Attica &middot; '+ROUNDS+' rounds</p><h1>Your move</h1>' + scene()
        + '<p>You and one other person will each play '+ROUNDS+' rounds. Choices are private until you reveal them out loud together. You will keep your own score.</p>'
        + '<button class="primary" data-act="start">Begin round 1</button>';
    } else if(S.phase==="choose"){
      h = '<p class="mono">Round '+S.round+' of '+ROUNDS+' &middot; private decision</p><h1>Do not show your screen</h1>'
        + scoreBar() + '<h2>Payoffs</h2>' + matrix()
        + '<h2>Your choice</h2><div class="row">'
        + '<button class="choice" data-act="pick" data-v="C"><b>Cooperate</b><span>Form a strategic alliance for mutual benefit</span></button>'
        + '<button class="choice" data-act="pick" data-v="X"><b>Compete</b><span>Launch an aggressive market strategy to secure your position</span></button></div>';
    } else if(S.phase==="reveal"){
      h = '<p class="mono">Round '+S.round+' of '+ROUNDS+'</p><h1>Locked in</h1>'
        + '<div class="card"><p class="lock">You chose <b>'+NAME[S.pending]+'</b>. This cannot be changed.</p>'
        + '<p>Look up from the screen. Count to three out loud together, then each say your choice out loud.</p></div>'
        + '<button class="primary" data-act="said">We both said it</button>';
    } else if(S.phase==="enter"){
      h = '<p class="mono">Round '+S.round+' of '+ROUNDS+'</p><h1>What did your '+word()+' say?</h1>'
        + '<p>Tap the choice you <em>heard</em>. Do not tap your own again.</p>'
        + '<div class="row"><button data-act="theirs" data-v="C">They said Cooperate</button><button data-act="theirs" data-v="X">They said Compete</button></div>';
    } else if(S.phase==="result"){
      var i=S.mine.length-1, key=S.mine[i]+S.theirs[i], p=PTS[key];
      h = '<p class="mono">Round '+S.round+' of '+ROUNDS+' result</p><h1>'+NAME[S.mine[i]]+' vs. '+NAME[S.theirs[i]]+'</h1>'
        + '<div class="card"><p>'+esc(OUT[key])+'</p><p class="big">You +'+p[0]+' &nbsp; Them +'+p[1]+'</p></div>'
        + scoreBar()
        + '<p class="small">Check: your totals should be the mirror image of theirs. If they are not, one of you tapped the wrong choice. Fix it now.</p>'
        + '<div class="row"><button class="ghost" data-act="fix">I tapped the wrong choice</button></div><p></p>'
        + '<button class="primary" data-act="next">'+(S.round<ROUNDS?"Begin round "+(S.round+1):"See final score")+'</button>';
    } else if(S.phase==="final"){
      var t=totals();
      h = '<p class="mono">Attica &middot; finished</p><h1>The simulation is over</h1>' + scoreBar()
        + '<div class="card"><p>Talk with the other person. What motivated your choices? Were you driven by competition, cooperation, or a mix of both?</p></div>'
        + '<p>Your instructor will ask for a show of hands. Do not look at each other’s first screen yet.</p>'
        + '<div class="card" id="frame-box"><button data-act="showframe">Show me my frame</button></div>';
    } else if(S.phase==="instructor"){
      h = instructorHTML();
    }
    h += '<div class="foot row"><button class="ghost" data-act="restart">Start over</button></div>';
    app.innerHTML = h;
    window.scrollTo(0,0);
  }

  function instructorHTML(){
    var base = location.href.split("#")[0];
    return '<p class="mono">Instructor notes &middot; not for students</p><h1>Attica</h1>'
      + '<p>A four-minute pairs activity. Each pair plays the same three-round game on two separate devices. The payoffs are identical. One word in the story differs: one player’s counterpart is a <b>partner</b>, the other’s is a <b>competitor</b>.</p>'
      + '<h2>Links</h2>'
      + '<p>Give students one of these two links, or have them open the plain link and pick a seat.</p>'
      + '<table><tr><th>Seat 1 (partner)</th><td><code>'+esc(base)+'#1</code></td></tr><tr><th>Seat 2 (competitor)</th><td><code>'+esc(base)+'#2</code></td></tr></table>'
      + '<h2>Before you start</h2><ol class="steps">'
      + '<li>Pair students and assign seats out loud. If both claim Seat 1, the contrast disappears, and nothing on the screen will tell them.</li>'
      + '<li>Say that choices stay private until the count of three, and that each person types what they <em>heard</em>, never their own choice twice.</li>'
      + '<li>Do not show or describe the two scenes. The wording is the lesson.</li></ol>'
      + '<h2>Run of show</h2><table>'
      + '<tr><th>Step</th><th class="n">Minutes</th></tr>'
      + '<tr><td>Pair, assign seats, open the page</td><td class="n">1</td></tr>'
      + '<tr><td>Three rounds (about 40 seconds each)</td><td class="n">2 to 3</td></tr>'
      + '<tr><td>Tally the room: how many Compete choices?</td><td class="n">1</td></tr>'
      + '<tr><td>Reveal the frame, then debrief</td><td class="n">5 to 10</td></tr></table>'
      + '<h2>Reveal</h2><p>After the tally, have students tap <b>Show me my frame</b> and read the phrase aloud to their pair. Seat 1 reads “your potential partner.” Seat 2 reads “a competitor.”</p>'
      + '<h2>If it goes wrong</h2><ul class="steps">'
      + '<li>Totals that do not mirror mean someone tapped the wrong choice. Use <b>I tapped the wrong choice</b>.</li>'
      + '<li>No devices or no signal: use the two printed handouts from the appendix and a pencil. The game is the same.</li></ul>'
      + '<p class="small">This page runs entirely in the browser. It sends nothing anywhere and needs no login. Progress is kept in the tab only.</p>';
  }

  function act(a, v){
    if(a==="seat"){ S=fresh(+v); }
    else if(a==="start"){ S.phase="choose"; }
    else if(a==="pick"){ S.pending=v; S.phase="reveal"; }
    else if(a==="said"){ S.phase="enter"; }
    else if(a==="theirs"){ S.mine.push(S.pending); S.theirs.push(v); S.phase="result"; }
    else if(a==="fix"){ S.mine.pop(); S.theirs.pop(); S.phase="enter"; }
    else if(a==="next"){ if(S.round<ROUNDS){ S.round++; S.pending=null; S.phase="choose"; } else { S.phase="final"; } }
    else if(a==="restart"){ S=fresh(S.seat); }
    else if(a==="showframe"){
      var w=word();
      document.getElementById("frame-box").innerHTML =
        '<p>In your story, the other company was described as: '+(S.seat===1?"your potential partner":"a competitor")+'</p><p class="small">Now compare with the person next to you.</p>';
      return;
    }
    save(); render();
  }

  app.addEventListener("click", function(e){
    var b = e.target.closest("button[data-act]");
    if(b) act(b.getAttribute("data-act"), b.getAttribute("data-v"));
  });

  function boot(){
    var h = (location.hash||"").replace("#","").toLowerCase();
    if(h==="instructor"){ S={phase:"instructor",seat:0,round:1,mine:[],theirs:[],pending:null}; render(); return; }
    var saved = load();
    var want = (h==="1"||h==="2") ? +h : 0;
    if(saved && saved.phase!=="instructor" && (!want || saved.seat===want)){ S=saved; }
    else { S=fresh(want); }
    save(); render();
  }
  window.addEventListener("hashchange", boot);
  boot();
})();
</script>
</body>
</html>
