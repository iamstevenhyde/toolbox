.src-block{margin:18px 0 0;padding:14px 16px;border-left:3px solid var(--teal);background:rgba(44,74,71,.12);max-width:52ch}
.src-block .src-label{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--teal-lt);display:block;margin-bottom:6px}
.src-block .src-cite{font-size:14px;color:var(--bone-dim);line-height:1.55}
.src-block .src-doi{display:inline-block;margin-top:7px;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.5px;color:var(--teal-lt);border-bottom:1px solid var(--teal-lt)}
.src-block .src-doi:hover{color:var(--ember);border-color:var(--ember)}
.series-strip{margin-bottom:20px;font-size:14px;color:var(--soft)}
.series-strip .series-label{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--verm);margin-right:8px}
.series-strip a{color:var(--verm);border-bottom:1px dotted var(--verm)}
.series-strip a:hover{color:var(--ink);border-color:var(--ink)}

<header class="site"><div class="sheet">

  </div>
</div></header>

<div class="sheet"><a class="back" href="./index.html">← back to the bench</a></div>
<div id="hang"></div>
<div id="sheetzone"></div>

<footer class="site"><div class="sheet"><div class="row">
  <span><svg class="mark sm" viewBox="0 0 100 100" aria-hidden="true"><use href="#tbmark"/></svg>Steven J. Hyde · Associate Professor of Management · Boise State</span>
  
  <span>Grounded in reality</span>
</div></div></footer>

<script src="assets/data.js"></script>
<script>
const fixu = u => u && u.startsWith("./assets/") ? "." + u : u;
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const id = new URLSearchParams(location.search).get("id");
const B = window.HT.bench||[];
const t = B.find(x=>x.id===id);
const hang = document.getElementById("hang");
const zone = document.getElementById("sheetzone");
if(!t){
  hang.innerHTML = `<div class="sheet"><div class="hang"><div></div><div>
    <h1>Not found</h1>
    <div class="dg">That tool is not on the bench. <a href="./index.html">Browse the gallery →</a></div>
  </div></div></div>`;
} else {
  document.title = `The Toolbox · ${t.n}`;
  const no = String(B.indexOf(t)+1).padStart(2,"0");
  const srcBlock = t.lit ? `<div class="src-block"><span class="src-label">Published activity</span><span class="src-cite">${t.citation||''}</span>${t.doi?`<a class="src-doi" href="${t.doi}" target="_blank">${t.doi}</a>`:''}</div>` : '';
  const siblings = (t.series && B.filter(x=>x.series===t.series && x.id!==t.id)) || [];
  const seriesStrip = (t.series && siblings.length) ? `<div class="series-strip"><span class="series-label">Part of</span>${t.series}: ${siblings.map(s=>`<a href="./tool.html?id=${s.id}">${s.n}</a>`).join(", ")}</div>` : '';
  hang.innerHTML = `<div class="sheet"><div class="hang">
    <div class="frame"><span class="cover" role="img" aria-label="${t.n} cover" style="display:block;aspect-ratio:3/4;background:url('assets/img/covers/${t.cover}') center/cover no-repeat"></span></div>
    <div>
      <div><span class="dk">${t.k}${t.ai?' · AI-built':''}</span><span class="spec-no">No. ${no} of ${B.length}</span></div>
      <h1>${t.n}</h1>
      <div class="dg">Grounded in ${t.paper?`<a href="./about.html#${t.paper}">${t.g}</a>`:t.g}</div>
      ${srcBlock}
      <div class="actions">
        ${t.url?`<a class="btn primary" href="${t.url}" target="_blank">Open the ${t.run&&t.run.platform==="Poe"?"bot":"GPT"} ↗</a>`:''}
        <a class="btn" href="./index.html">More from the bench</a>
      </div>
    </div>
  </div></div>`;
  zone.innerHTML = `<div class="paperzone"><div class="sheet"><div class="dsheet"><div class="cols">
    <div>
      ${seriesStrip}
      <p class="dblurb">${t.blurb}</p>
      ${t.purpose?`<div class="dsub">Why this exists</div><p class="dhow">${t.purpose}</p>`:''}
      ${t.run?`<div class="dsub">Field notes</div><div class="specs">${[["time","Time"],["level","Level"],["size","Format"],["platform","Platform"],["prep","Prep"]].filter(p=>t.run[p[0]]).map(p=>`<div class="spec"><span class="sl">${p[1]}</span><span class="sv">${t.run[p[0]]}</span></div>`).join("")}</div>`:''}
      ${t.framework?`<div class="dsub">The framework</div><p class="dhow">${t.framework}</p>`:''}
      ${t.how?`<div class="dsub">How it runs</div><p class="dhow">${t.how}</p>`:''}
      ${t.steps&&t.steps.length?`<div class="dsub">Run of show</div><ol class="steps">${t.steps.map(s=>`<li><span>${s}</span></li>`).join("")}</ol>`:''}
      ${t.prompt?`<div class="dsub">The prompt. Copy it, run it, remix it</div><div class="promptbox"><button class="copybtn" id="copybtn">copy</button><pre id="prompttext">${esc(t.prompt)}</pre></div>`:''}
      ${t.debrief&&t.debrief.length?`<div class="dsub">Debrief questions</div><ul class="debrief">${t.debrief.map(q=>`<li>${q}</li>`).join("")}</ul>`:''}
      ${t.materials&&t.materials.length?`<div class="dsub">Materials</div><ul class="mats">${t.materials.map(m=>`<li><span class="mk">${m.k}</span>${m.u?`<a href="${fixu(m.u)}" target="_blank">${m.l} ↗</a>`:m.l}</li>`).join("")}</ul>`:''}
    </div>
    <div class="sidecol">
      ${t.note?`<div class="dsub" style="margin-top:0">Teaching note</div><div class="note">${t.note}</div>`:''}
    </div>
  </div></div></div></div>`;
  const cb = document.getElementById("copybtn");
  if(cb) cb.addEventListener("click", ()=>{
    const txt = document.getElementById("prompttext").textContent;
    const done = ()=>{ cb.textContent="copied"; setTimeout(()=>cb.textContent="copy",1600); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(()=>fallback()); } else fallback();
    function fallback(){ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); done(); }
  });
}
</script>
<script src="./assets/cmdk.js"></script>
</body>
